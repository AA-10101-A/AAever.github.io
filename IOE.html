<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>inside ur Eyes:)</title>
<link rel="icon" type="image/png" href="./a-retro-styled-pixel-art-illustration-of-a-mini-blue-heart-icon-free-png-removebg-preview.png" sizes="16x16">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02000b;
    user-select: none;
    touch-action: none;
}

#galaxy {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.controls {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 20;
}

.icon-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    box-shadow:
        0 5px 30px rgba(0,0,0,.45),
        inset 0 0 15px rgba(255,255,255,.04);
    cursor: pointer;
    transition: transform .15s ease;
}

.icon-btn:active {
    transform: scale(.86);
}

.heart {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    font-size: 42px;
    transform: translate(-50%, -50%);
    animation: flyHeart 2.3s cubic-bezier(.2,.7,.2,1) forwards;
    filter:
        drop-shadow(0 0 8px rgba(120,220,255,.9))
        drop-shadow(0 0 25px rgba(100,190,255,.7));
}

@keyframes flyHeart {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.25);
    }

    12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.25);
    }

    25% {
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 280px)) scale(.65);
    }
}
</style>
</head>

<body>

<canvas id="galaxy"></canvas>

<audio id="starSound" preload="auto">
    <source src="./galaxy.mp3" type="audio/mpeg">
</audio>

<audio id="screenshotSound" preload="auto">
    <source src="./ss.mp3" type="audio/mpeg">
</audio>

<audio id="trashSound" preload="auto">
    <source src="./trash.mp3" type="audio/mpeg">
</audio>

<audio id="undoSound" preload="auto">
    <source src="./undo.mp3" type="audio/mpeg">
</audio>

<div class="controls">
    <button class="icon-btn" id="undo">↩</button>
    <button class="icon-btn" id="screenshot">📸</button>
    <button class="icon-btn" id="clear">🗑️</button>
</div>

<script>
const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

const starSound = document.getElementById("starSound");
const screenshotSound = document.getElementById("screenshotSound");
const trashSound = document.getElementById("trashSound");
const undoSound = document.getElementById("undoSound");

let width = 0;
let height = 0;
let dpr = 1;

let stars = [];
let backgroundStars = [];
let particles = [];

let pointerDown = false;
let longPressTriggered = false;
let longPressTimer = null;

const LONG_PRESS_TIME = 520;

let heartCooldown = false;

function playSound(audio) {
    audio.currentTime = 0;

    const promise = audio.play();

    if (promise !== undefined) {
        promise.catch(() => {});
    }
}

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createBackgroundStars();
}

function createBackgroundStars() {
    backgroundStars = [];

    const count = Math.floor((width * height) / 4200);

    for (let i = 0; i < count; i++) {
        backgroundStars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.25 + .2,
            alpha: Math.random() * .65 + .15,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * .0015 + .0005
        });
    }
}

function createParticles(x, y) {
    for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 1.6 + .5;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: Math.random() * 1.8 + .5
        });
    }
}

function addStar(x, y, connect) {
    stars.push({
        x: x,
        y: y,
        radius: 4,
        pulse: Math.random() * Math.PI * 2,
        connect: connect
    });

    createParticles(x, y);

    playSound(starSound);

    setTimeout(detectHeart, 60);
}

canvas.addEventListener("pointerdown", function(e) {
    if (e.clientY > height - 100) return;

    pointerDown = true;
    longPressTriggered = false;

    clearTimeout(longPressTimer);

    longPressTimer = setTimeout(function() {
        if (!pointerDown) return;

        longPressTriggered = true;

        addStar(
            e.clientX,
            e.clientY,
            false
        );
    }, LONG_PRESS_TIME);
});

canvas.addEventListener("pointerup", function(e) {
    if (!pointerDown) return;

    pointerDown = false;

    clearTimeout(longPressTimer);

    if (!longPressTriggered) {
        addStar(
            e.clientX,
            e.clientY,
            stars.length > 0
        );
    }
});

canvas.addEventListener("pointercancel", function() {
    pointerDown = false;
    clearTimeout(longPressTimer);
});

function drawBackground(time) {
    const gradient = ctx.createRadialGradient(
        width * .5,
        height * .42,
        0,
        width * .5,
        height * .42,
        Math.max(width, height)
    );

    gradient.addColorStop(0, "#12052d");
    gradient.addColorStop(.4, "#08021c");
    gradient.addColorStop(1, "#010008");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    const nebula1 = ctx.createRadialGradient(
        width * .18,
        height * .35,
        0,
        width * .18,
        height * .35,
        width * .65
    );

    nebula1.addColorStop(0, "rgba(92,50,210,.16)");
    nebula1.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = nebula1;
    ctx.fillRect(0, 0, width, height);

    const nebula2 = ctx.createRadialGradient(
        width * .85,
        height * .7,
        0,
        width * .85,
        height * .7,
        width * .55
    );

    nebula2.addColorStop(0, "rgba(40,100,220,.11)");
    nebula2.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = nebula2;
    ctx.fillRect(0, 0, width, height);

    backgroundStars.forEach(star => {
        const twinkle =
            Math.sin(
                time * star.speed + star.phase
            );

        const alpha = Math.max(
            .05,
            star.alpha + twinkle * .16
        );

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.fill();
    });
}

function drawConnections() {
    if (stars.length < 2) return;

    ctx.save();

    ctx.lineWidth = 1.4;
    ctx.lineCap = "round";

    for (let i = 1; i < stars.length; i++) {
        const previous = stars[i - 1];
        const current = stars[i];

        if (!current.connect) continue;

        ctx.shadowBlur = 13;
        ctx.shadowColor =
            "rgba(130,180,255,.9)";

        const gradient =
            ctx.createLinearGradient(
                previous.x,
                previous.y,
                current.x,
                current.y
            );

        gradient.addColorStop(
            0,
            "rgba(165,130,255,.65)"
        );

        gradient.addColorStop(
            .5,
            "rgba(100,185,255,.9)"
        );

        gradient.addColorStop(
            1,
            "rgba(210,180,255,.65)"
        );

        ctx.strokeStyle = gradient;

        ctx.beginPath();

        ctx.moveTo(
            previous.x,
            previous.y
        );

        ctx.lineTo(
            current.x,
            current.y
        );

        ctx.stroke();
    }

    ctx.restore();
}

function drawStars() {
    stars.forEach(star => {
        star.pulse += .035;

        const pulse =
            Math.sin(star.pulse) * .8;

        const radius =
            Math.max(
                1.5,
                star.radius + pulse
            );

        ctx.save();

        ctx.shadowBlur = 24;
        ctx.shadowColor =
            "rgba(140,190,255,1)";

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

        ctx.save();

        ctx.globalAlpha = .55;
        ctx.strokeStyle = "white";
        ctx.lineWidth = .7;

        ctx.beginPath();

        ctx.moveTo(
            star.x - 8,
            star.y
        );

        ctx.lineTo(
            star.x + 8,
            star.y
        );

        ctx.moveTo(
            star.x,
            star.y - 8
        );

        ctx.lineTo(
            star.x,
            star.y + 8
        );

        ctx.stroke();

        ctx.restore();
    });
}

function drawParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .96;
        p.vy *= .96;

        p.life -= .025;

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life);

        ctx.fillStyle = "white";

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#9fc8ff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });

    particles =
        particles.filter(
            p => p.life > 0
        );
}

function detectHeart() {
    if (heartCooldown) return;
    if (stars.length < 5) return;

    let group = [];

    for (let i = stars.length - 1; i >= 0; i--) {
        group.unshift(stars[i]);

        if (
            i > 0 &&
            !stars[i].connect
        ) {
            break;
        }
    }

    if (group.length < 5) return;

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    group.forEach(star => {
        minX = Math.min(minX, star.x);
        maxX = Math.max(maxX, star.x);
        minY = Math.min(minY, star.y);
        maxY = Math.max(maxY, star.y);
    });

    const w = maxX - minX;
    const h = maxY - minY;

    if (w < 70 || h < 70) return;

    const centerX =
        (minX + maxX) / 2;

    const upper =
        group.filter(
            p =>
                p.y <
                minY + h * .48
        );

    const lower =
        group.filter(
            p =>
                p.y >
                minY + h * .52
        );

    const left =
        upper.some(
            p =>
                p.x <
                centerX - w * .15
        );

    const right =
        upper.some(
            p =>
                p.x >
                centerX + w * .15
        );

    const bottom =
        lower.some(
            p =>
                Math.abs(
                    p.x - centerX
                ) < w * .38
        );

    if (
        upper.length >= 3 &&
        lower.length >= 2 &&
        left &&
        right &&
        bottom
    ) {
        heartCooldown = true;

        createHeart(
            centerX,
            minY + h * .5
        );

        setTimeout(() => {
            heartCooldown = false;
        }, 2500);
    }
}

function createHeart(x, y) {
    const heart =
        document.createElement("div");

    heart.className = "heart";
    heart.textContent = "🩵";

    heart.style.left =
        x + "px";

    heart.style.top =
        y + "px";

    document.body.appendChild(heart);

    createParticles(x, y);

    setTimeout(() => {
        heart.remove();
    }, 2400);
}

document
.getElementById("undo")
.addEventListener("click", function() {
    if (stars.length === 0) return;

    const removed = stars.pop();

    createParticles(
        removed.x,
        removed.y
    );

    heartCooldown = false;

    playSound(undoSound);
});

document
.getElementById("clear")
.addEventListener("click", function() {
    if (stars.length === 0) return;

    stars = [];
    particles = [];
    heartCooldown = false;

    playSound(trashSound);
});

document
.getElementById("screenshot")
.addEventListener("click", function() {
    playSound(screenshotSound);

    const shot =
        document.createElement("canvas");

    shot.width =
        width * dpr;

    shot.height =
        height * dpr;

    const sctx =
        shot.getContext("2d");

    sctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    const gradient =
        sctx.createRadialGradient(
            width * .5,
            height * .42,
            0,
            width * .5,
            height * .42,
            Math.max(
                width,
                height
            )
        );

    gradient.addColorStop(
        0,
        "#12052d"
    );

    gradient.addColorStop(
        .4,
        "#08021c"
    );

    gradient.addColorStop(
        1,
        "#010008"
    );

    sctx.fillStyle = gradient;

    sctx.fillRect(
        0,
        0,
        width,
        height
    );

    backgroundStars.forEach(star => {
        sctx.beginPath();

        sctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        sctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${star.alpha}
            )`;

        sctx.fill();
    });

    sctx.save();

    sctx.lineWidth = 1.4;
    sctx.lineCap = "round";

    for (
        let i = 1;
        i < stars.length;
        i++
    ) {
        const a = stars[i - 1];
        const b = stars[i];

        if (!b.connect) continue;

        sctx.shadowBlur = 12;

        sctx.shadowColor =
            "rgba(130,180,255,.8)";

        sctx.strokeStyle =
            "rgba(150,175,255,.8)";

        sctx.beginPath();

        sctx.moveTo(
            a.x,
            a.y
        );

        sctx.lineTo(
            b.x,
            b.y
        );

        sctx.stroke();
    }

    sctx.restore();

    stars.forEach(star => {
        sctx.save();

        sctx.shadowBlur = 22;

        sctx.shadowColor =
            "rgba(140,190,255,1)";

        sctx.fillStyle = "white";

        sctx.beginPath();

        sctx.arc(
            star.x,
            star.y,
            4,
            0,
            Math.PI * 2
        );

        sctx.fill();

        sctx.restore();
    });

    const link =
        document.createElement("a");

    link.download =
        "Inside_Your_Eyes✨.png";

    link.href =
        shot.toDataURL("image/png");

    link.click();
});

function animate(time) {
    drawBackground(time);
    drawConnections();
    drawStars();
    drawParticles();

    requestAnimationFrame(animate);
}

resize();

window.addEventListener(
    "resize",
    resize
);

requestAnimationFrame(animate);
</script>

</body>
</html>
